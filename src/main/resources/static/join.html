
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Join Queue | SmartQueue</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
    <a class="brand" href="/index.html">◉ SmartQueue</a>
    <div>
        <a href="/dashboard.html">Dashboard</a>
        <a class="active" href="/join.html">Join Queue</a>
        <a href="/track.html">Track Token</a>
    </div>
</nav>

<main class="narrow">

    <section class="hero compact">
        <div>
            <span class="eyebrow">WELCOME</span>
            <h1>Join the queue</h1>
            <p>Enter your name to receive a digital token.</p>
        </div>
    </section>

    <section class="panel form-panel">

        <form id="joinForm">
            <label for="customerName">Customer name</label>

            <input
                id="customerName"
                name="customerName"
                maxlength="60"
                minlength="2"
                placeholder="Enter your full name"
                required
            >

            <button class="btn primary full" type="submit">
                Generate my token
            </button>
        </form>

        <div id="result" class="result hidden"></div>

        <p class="muted">
            Keep your token number safe so you can track your turn.
        </p>

    </section>

</main>

<div id="toast" class="toast"></div>

<script src="/js/app.js"></script>

</body>
</html>
