
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Track Token | SmartQueue</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav>
    <a class="brand" href="/index.html">◉ SmartQueue</a>
    <div>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/join.html">Join Queue</a>
        <a class="active" href="/track.html">Track Token</a>
    </div>
</nav>

<main class="narrow">

    <section class="hero compact">
        <div>
            <span class="eyebrow">LIVE STATUS</span>
            <h1>Track your token</h1>
            <p>Check your current queue position.</p>
        </div>
    </section>

    <section class="panel form-panel">

        <form id="trackForm">
            <label for="token">Token number</label>

            <input
                id="token"
                name="token"
                placeholder="e.g. SQ-20261030-001"
                required
            >

            <button class="btn primary full" type="submit">
                Check status
            </button>
        </form>

        <div id="trackResult" class="result hidden"></div>

        <p class="muted">
            Your token number is shown after you join the queue.
        </p>

    </section>

</main>

<div id="toast" class="toast"></div>

<script src="/js/app.js"></script>

</body>
</html>
